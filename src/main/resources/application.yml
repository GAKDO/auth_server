# 공통 설정. 학교 클러스터 값(주소·비밀번호)은 gitops 레포의 ConfigMap trace-infra와 Secret trace-secrets가 환경 변수로 넣는다
server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: auth-server
  threads:
    virtual:
      enabled: true
  # 봉인 영수증(trace.record.sealed)만 받는다. 주소·계정은 infra.env·trace-secrets
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false   # 계속 실패하면 다시 넣지 않고 trace.dlx로
        retry:
          enabled: true
          max-attempts: 3
  datasource:
    # DB trace 안에서 auth 스키마만 쓴다(헌법 II)
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trace}?currentSchema=auth
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # 스키마는 Flyway만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    schemas: auth
    default-schema: auth
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:2}
      password: ${REDIS_PASSWORD:}
  # 인증·재설정 코드 메일(팀 Gmail SMTP). 주소는 infra.env, 계정·앱 비밀번호는 trace-secrets(.env). 비어 있으면 보내지 않고 로그만 남긴다
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # STARTTLS를 못 쓰면 평문으로 보내지 않고 실패한다
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  commit: ${APP_COMMIT:unknown}   # 이미지에 구운 커밋 SHA. /ping 응답에 실려 배포 확인에 쓴다

trace:
  auth:
    issuer: trace
    # PKCS#8 PEM을 base64 -w0로 한 줄로 만든 값(trace-secrets). 비어 있으면 school 프로필이 아닐 때만 임시 키를 만든다
    jwt-private-key: ${JWT_PRIVATE_KEY:}
    redis-key-prefix: ${REDIS_KEY_PREFIX:trace:}
    web-public-url: ${WEB_PUBLIC_URL:http://localhost:8315}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    capture-token-ttl: 30m
    booth-token-ttl: 1h
    agent-token-ttl: 10m
    pairing-code-ttl: 5m
    capture-link-ttl: 30m
    cookie-secure: true
    # 이메일 인증·비밀번호 재설정 코드(설계서 "이메일 인증·비밀번호 재설정")
    email-code:
      ttl: 10m
      max-attempts: 5
      resend-interval: 60s
      from: ${SMTP_FROM:${SMTP_USERNAME:}}
    # 초기 데이터(trace-secrets). 비어 있으면 만들지 않고 경고만 남긴다
    initial-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    initial-booth:
      client-id: ${BOOTH_CLIENT_ID:}
      client-secret: ${BOOTH_CLIENT_SECRET:}
    # 시연용 고객 계정(trace-secrets). 비어 있으면 만들지 않는다
    demo-customer:
      email: ${DEMO_CUSTOMER_EMAIL:}
      password: ${DEMO_CUSTOMER_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false   # SMTP가 잠깐 안 돼도 프로브가 실패해 재시작되지 않게(메일 실패는 로그로 본다)
    rabbit:
      enabled: false   # 영수증은 나중에 다시 받으면 되므로 RabbitMQ가 잠깐 안 돼도 로그인 서버를 재시작하지 않게
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness·readiness (쿠버네티스 프로브)
---
spring:
  config:
    activate:
      on-profile: school
trace:
  auth:
    require-configured-key: true   # 학교 클러스터에서는 JWT_PRIVATE_KEY가 없으면 시작하지 않는다
